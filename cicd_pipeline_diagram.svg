<svg width="100%" viewBox="0 0 680 860" role="img" xmlns="http://www.w3.org/2000/svg">
<title>CI/CD Pipeline Diagram v3</title>
<desc>GitHub Actions CI/CD pipeline flow with correct order - dependencies installed before pylint</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
  text { font-family: Arial, sans-serif; fill: #333; }
  .th { font-size: 14px; font-weight: 600; fill: #1a1a2e; }
  .ts { font-size: 12px; fill: #555; }
  .arr { stroke: #888; stroke-width: 1.5; fill: none; }
  .c-gray rect { fill: #f1efe8; stroke: #888780; }
  .c-purple rect { fill: #eeedfe; stroke: #534ab7; }
  .c-amber rect { fill: #faeeda; stroke: #ba7517; }
  .c-teal rect { fill: #e1f5ee; stroke: #0f6e56; }
  .c-blue rect { fill: #e6f1fb; stroke: #185fa5; }
  .c-green rect { fill: #eaf3de; stroke: #3b6d11; }
  .c-gray .th { fill: #2c2c2a; }
  .c-purple .th { fill: #26215c; }
  .c-amber .th { fill: #412402; }
  .c-teal .th { fill: #04342c; }
  .c-blue .th { fill: #042c53; }
  .c-green .th { fill: #173404; }
  .c-gray .ts { fill: #5f5e5a; }
  .c-purple .ts { fill: #534ab7; }
  .c-amber .ts { fill: #854f0b; }
  .c-teal .ts { fill: #0f6e56; }
  .c-blue .ts { fill: #185fa5; }
  .c-green .ts { fill: #3b6d11; }
</style>
</defs>

<g class="c-gray">
<rect x="240" y="20" width="200" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">Push to master</text>
</g>
<line x1="340" y1="64" x2="340" y2="98" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="190" y="98" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="116" text-anchor="middle" dominant-baseline="central">Checkout + setup Python</text>
<text class="ts" x="340" y="138" text-anchor="middle" dominant-baseline="central">actions/checkout@v3 + setup-python@v4</text>
</g>
<line x1="340" y1="154" x2="340" y2="188" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="190" y="188" width="300" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="210" text-anchor="middle" dominant-baseline="central">Install dependencies</text>
</g>
<line x1="340" y1="232" x2="340" y2="266" class="arr" marker-end="url(#arrow)"/>

<g class="c-amber">
<rect x="190" y="266" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="284" text-anchor="middle" dominant-baseline="central">Pylint code quality</text>
<text class="ts" x="340" y="306" text-anchor="middle" dominant-baseline="central">score ≥ 8.0 — fail if below</text>
</g>
<line x1="340" y1="322" x2="340" y2="356" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
<rect x="190" y="356" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="374" text-anchor="middle" dominant-baseline="central">Sanity tests</text>
<text class="ts" x="340" y="396" text-anchor="middle" dominant-baseline="central">sanity + excel_sanity + bot_sanity</text>
</g>
<line x1="340" y1="412" x2="340" y2="446" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
<rect x="190" y="446" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="464" text-anchor="middle" dominant-baseline="central">All tests</text>
<text class="ts" x="340" y="486" text-anchor="middle" dominant-baseline="central">bot + excel + python (no E2E/selenium)</text>
</g>
<line x1="340" y1="502" x2="340" y2="536" class="arr" marker-end="url(#arrow)"/>

<g class="c-amber">
<rect x="190" y="536" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="554" text-anchor="middle" dominant-baseline="central">Coverage check</text>
<text class="ts" x="340" y="576" text-anchor="middle" dominant-baseline="central">coverage ≥ 90% — fail if below</text>
</g>
<line x1="340" y1="592" x2="340" y2="626" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
<rect x="190" y="626" width="300" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="648" text-anchor="middle" dominant-baseline="central">E2E tests</text>
</g>
<line x1="340" y1="670" x2="340" y2="704" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue">
<rect x="190" y="704" width="300" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="726" text-anchor="middle" dominant-baseline="central">Build + push to DockerHub</text>
</g>
<line x1="340" y1="748" x2="340" y2="782" class="arr" marker-end="url(#arrow)"/>

<g class="c-green">
<rect x="190" y="782" width="300" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="804" text-anchor="middle" dominant-baseline="central">Deploy to AWS Lambda</text>
</g>

<text class="ts" x="500" y="298" text-anchor="start" fill="#854F0B">← fail: stop</text>
<text class="ts" x="500" y="568" text-anchor="start" fill="#854F0B">← fail: stop</text>

</svg>
